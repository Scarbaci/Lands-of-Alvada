            { id: "Grey-1", category: "mountain", number: 1, name: "Kasiasadi Bluff", x: 23.4, y: 18.3 },
            { id: "Grey-2", category: "mountain", number: 2, name: "Chenonsana Range", x: 16.9, y: 31.6 },

            { id: "Grey-6", category: "mountain", number: 6, name: "Kirysnosa Loft", x: 37.5, y: 53.4 },
            { id: "Grey-7", category: "mountain", number: 7, name: "Peltinode Alps", x: 34.9, y: 60.3 },
            { id: "Grey-8", category: "mountain", number: 8, name: "Grosiardico Range", x: 20.5, y: 64.0 },
            { id: "Grey-9", category: "mountain", number: 9, name: "Deondrese Spire", x: 13.7, y: 90.2 },
            { id: "Grey-10", category: "mountain", number: 10, name: "Virdonlisi Rise", x: 44.2, y: 80.9 },
            { id: "Grey-11", category: "mountain", number: 11, name: "Sanopthori Spine", x: 69.6, y: 79.4 },
            { id: "Grey-12", category: "mountain", number: 12, name: "Virnonnica Alps", x: 90.4, y: 78.3 },
            { id: "Grey-13", category: "mountain", number: 13, name: "Thelosnasi Range", x: 82.6, y: 87.5 },
            { id: "Grey-14", category: "mountain", number: 14, name: "Kesnernosa Summit", x: 69.6, y: 90.2 }
        ];

        // Category Visual Config
        const categoryConfig = {
            forest: { name: "Forest", color: "#10b981", badgeBg: "bg-emerald-500" },
            mountain: { name: "Mountain", color: "#94a3b8", badgeBg: "bg-slate-400" },
            lake: { name: "Lakes", color: "#0ea5e9", badgeBg: "bg-sky-400" },
            open_land: { name: "Open Land", color: "#f59e0b", badgeBg: "bg-amber-500" },
            town: { name: "Towns", color: "#a855f7", badgeBg: "bg-purple-500" }
        };

        // App State
        let activeCategories = { forest: true, mountain: true, lake: true, open_land: true, town: true };
        let searchQuery = "";
        let showEdges = true;
        let showMapBg = true;
        let mapOpacity = 0.8;
        let selectedLandmark = null;
        let hoveredLandmark = null;

        // Load Map Image Asset
        const mapImg = new Image();
        mapImg.src = 'image_89ae9d.jpg';
        mapImg.onload = () => drawGraph();
        mapImg.onerror = () => {
            // Fallback placeholder image URL if local asset relative path fails
            mapImg.src = 'https://placehold.co/800x680/1e293b/94a3b8?text=Realm+Map';
        };

        // Viewport Transform State
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // Initialize Canvas & Size
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth * window.devicePixelRatio;
            canvas.height = container.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            drawGraph();
        }

        // Convert Normalized Coordinates (0-100) to World Space
        function getMapDimensions() {
            const container = canvas.parentElement;
            const w = container.clientWidth;
            const h = container.clientHeight;
            const size = Math.min(w, h) * 0.85;
            const originX = (w - size) / 2;
            const originY = (h - size) / 2;
            return { size, originX, originY };
        }

        function normToScreen(nx, ny) {
            const { size, originX, originY } = getMapDimensions();
            // Note: invert y so y=0 is at bottom, y=100 is at top
            const wx = originX + (nx / 100) * size;
            const wy = originY + ((100 - ny) / 100) * size;
            return {
                x: wx * scale + offsetX,
                y: wy * scale + offsetY
            };
        }

        function screenToNorm(sx, sy) {
            const { size, originX, originY } = getMapDimensions();
            const unscaledX = (sx - offsetX) / scale;
            const unscaledY = (sy - offsetY) / scale;
            const nx = ((unscaledX - originX) / size) * 100;
            const ny = 100 - (((unscaledY - originY) / size) * 100);
            return { x: nx, y: ny };
        }

        // Main Draw Loop
        function drawGraph() {
            const container = canvas.parentElement;
            ctx.clearRect(0, 0, container.clientWidth, container.clientHeight);

            const { size, originX, originY } = getMapDimensions();

            // Render Map Image Background
            if (showMapBg && mapImg.complete && mapImg.naturalWidth !== 0) {
                ctx.save();
                ctx.globalAlpha = mapOpacity;

                const bgLeft = originX * scale + offsetX;
                const bgTop = originY * scale + offsetY;
                const bgSize = size * scale;

                ctx.drawImage(mapImg, bgLeft, bgTop, bgSize, bgSize);
                ctx.restore();
            }

            // Filter Landmarks
            const visibleLandmarks = landmarksData.filter(d => {
                if (!activeCategories[d.category]) return false;
                if (searchQuery && !d.name.toLowerCase().includes(searchQuery) && !d.id.toLowerCase().includes(searchQuery)) return false;
                return true;
            });

            // Update visible counter
            document.getElementById('visibleCount').textContent = `${visibleLandmarks.length}/${landmarksData.length} Visible`;

            // Compute Screen Positions
            const pointsWithScreen = visibleLandmarks.map(d => {
                const pos = normToScreen(d.x, d.y);
                return { ...d, sx: pos.x, sy: pos.y };
            });

            // Delaunay Triangulation & Edges
            let delaunayEdges = [];
            if (showEdges && pointsWithScreen.length >= 3 && window.Delaunay) {
                try {
                    const coords = pointsWithScreen.map(p => [p.sx, p.sy]);
                    const delaunay = window.Delaunay.from(coords);
                    const { halfedges, triangles } = delaunay;
                    
                    const edgeSet = new Set();
                    for (let i = 0; i < halfedges.length; i++) {
                        if (halfedges[i] > i) {
                            const p1 = triangles[i];
                            const p2 = triangles[delaunay.nextHalfedge(i)];
                            const key = p1 < p2 ? `${p1}-${p2}` : `${p2}-${p1}`;
                            if (!edgeSet.has(key)) {
                                edgeSet.add(key);
                                delaunayEdges.push([pointsWithScreen[p1], pointsWithScreen[p2]]);
                            }
                        }
                    }

                    // Draw Edges
                    ctx.save();
                    ctx.lineWidth = 1;
                    delaunayEdges.forEach(([a, b]) => {
                        const isConnectedToSelected = selectedLandmark && (a.id === selectedLandmark.id || b.id === selectedLandmark.id);
                        const isConnectedToHover = hoveredLandmark && (a.id === hoveredLandmark.id || b.id === hoveredLandmark.id);

                        if (isConnectedToSelected || isConnectedToHover) {
                            ctx.strokeStyle = '#6366f1';
                            ctx.lineWidth = 2.5;
                        } else {
                            ctx.strokeStyle = showMapBg ? 'rgba(15, 23, 42, 0.45)' : 'rgba(100, 116, 139, 0.25)';
                            ctx.lineWidth = 1;
                        }
                        ctx.beginPath();
                        ctx.moveTo(a.sx, a.sy);
                        ctx.lineTo(b.sx, b.sy);
                        ctx.stroke();
                    });
                    ctx.restore();
                } catch (e) {
                    console.error("Delaunay error:", e);
                }
            }

            // Draw Nodes
            pointsWithScreen.forEach(p => {
                const isSelected = selectedLandmark && selectedLandmark.id === p.id;
                const isHovered = hoveredLandmark && hoveredLandmark.id === p.id;
                const color = categoryConfig[p.category].color;

                ctx.save();
                
                // Outer glow for selected or hovered
                if (isSelected || isHovered) {
                    ctx.beginPath();
                    ctx.arc(p.sx, p.sy, isSelected ? 12 * scale : 10 * scale, 0, 2 * Math.PI);
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.3;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }

                // Node Circle
                ctx.beginPath();
                const radius = Math.max(4, Math.min(8, 6 * scale));
                ctx.arc(p.sx, p.sy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = isSelected ? 2.5 : 1.5;
                ctx.stroke();

                // Label if zoomed in or hovered/selected
                if (scale > 1.3 || isSelected || isHovered) {
                    ctx.font = `${Math.max(10, Math.min(12, 11 * scale))}px Inter, sans-serif`;
                    ctx.fillStyle = '#e2e8f0';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = '#000000';
                    ctx.fillText(p.name, p.sx + 12, p.sy + 4);
                }

                ctx.restore();
            });
        }

        // Get Delaunay Neighbors for a Landmark
        function getNeighbors(targetLandmark) {
            const visibleLandmarks = landmarksData.filter(d => activeCategories[d.category]);
            if (visibleLandmarks.length < 3 || !window.Delaunay) return [];
            
            const pointsWithScreen = visibleLandmarks.map(d => ({ ...d, ...normToScreen(d.x, d.y) }));
            const targetIndex = pointsWithScreen.findIndex(p => p.id === targetLandmark.id);
            if (targetIndex === -1) return [];

            try {
                const coords = pointsWithScreen.map(p => [p.sx, p.sy]);
                const delaunay = window.Delaunay.from(coords);
                const neighborIndexes = Array.from(delaunay.neighbors(targetIndex));
                return neighborIndexes.map(idx => pointsWithScreen[idx]);
            } catch (e) {
                return [];
            }
        }

        // Inspector Panel Update
        function updateInspector(landmark) {
            selectedLandmark = landmark;
            const emptyEl = document.getElementById('inspectorEmpty');
            const contentEl = document.getElementById('inspectorContent');

            if (!landmark) {
                emptyEl.classList.remove('hidden');
                contentEl.classList.add('hidden');
                drawGraph();
                return;
            }

            emptyEl.classList.add('hidden');
            contentEl.classList.remove('hidden');

            const config = categoryConfig[landmark.category];
            document.getElementById('inspectorCategory').textContent = config.name;
            document.getElementById('inspectorCategoryDot').className = `absolute top-0 left-0 bottom-0 w-1.5 ${config.badgeBg}`;
            document.getElementById('inspectorTitle').textContent = landmark.name;
            document.getElementById('inspectorId').textContent = landmark.id;
            document.getElementById('inspectorCoords').textContent = `(${landmark.x.toFixed(1)}, ${landmark.y.toFixed(1)})`;

            // Populate Neighbors
            const neighbors = getNeighbors(landmark);
            document.getElementById('neighborCount').textContent = `${neighbors.length} connections`;
            const listEl = document.getElementById('neighborList');
            listEl.innerHTML = '';

            if (neighbors.length === 0) {
                listEl.innerHTML = '<li class="text-xs text-slate-500 italic">No direct neighbors found in current view.</li>';
            } else {
                neighbors.forEach(n => {
                    const nConfig = categoryConfig[n.category];
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between p-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 cursor-pointer transition';
                    li.innerHTML = `
                        <div class="flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full ${nConfig.badgeBg}"></span>
                            <span class="text-xs text-slate-200 font-medium">${n.name}</span>
                        </div>
                        <span class="text-[10px] font-mono text-slate-400">${n.id}</span>
                    `;
                    li.addEventListener('click', () => {
                        updateInspector(n);
                    });
                    listEl.appendChild(li);
                });
            }

            drawGraph();
        }

        // Event Handlers & Interactivity
        window.addEventListener('delaunay-loaded', () => {
            resizeCanvas();
        });

        window.addEventListener('resize', resizeCanvas);

        // Mouse & Touch Pan / Zoom
        let pointerDown = false;
        let lastX = 0;
        let lastY = 0;

        canvas.addEventListener('mousedown', (e) => {
            pointerDown = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (pointerDown) {
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                offsetX += dx;
                offsetY += dy;
                lastX = e.clientX;
                lastY = e.clientY;
                drawGraph();
                hideTooltip();
                return;
            }

            // Check Hover
            const visibleLandmarks = landmarksData.filter(d => activeCategories[d.category] && (!searchQuery || d.name.toLowerCase().includes(searchQuery) || d.id.toLowerCase().includes(searchQuery)));
            let found = null;
            for (const p of visibleLandmarks) {
                const pos = normToScreen(p.x, p.y);
                const dist = Math.hypot(pos.x - mouseX, pos.y - mouseY);
                if (dist < 12) {
                    found = p;
                    break;
                }
            }

            if (found !== hoveredLandmark) {
                hoveredLandmark = found;
                drawGraph();
                if (hoveredLandmark) {
                    showTooltip(hoveredLandmark, e.clientX, e.clientY);
                } else {
                    hideTooltip();
                }
            } else if (hoveredLandmark) {
                updateTooltipPosition(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mouseup', () => {
            pointerDown = false;
        });

        // Click to select node
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const visibleLandmarks = landmarksData.filter(d => activeCategories[d.category] && (!searchQuery || d.name.toLowerCase().includes(searchQuery) || d.id.toLowerCase().includes(searchQuery)));
            let clicked = null;
            for (const p of visibleLandmarks) {
                const pos = normToScreen(p.x, p.y);
                const dist = Math.hypot(pos.x - mouseX, pos.y - mouseY);
                if (dist < 15) {
                    clicked = p;
                    break;
                }
            }

            if (clicked) {
                updateInspector(clicked);
            }
        });

        // Zoom via mouse wheel
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
            const newScale = Math.max(0.5, Math.min(10, scale * zoomFactor));

            offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
            offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
            scale = newScale;

            drawGraph();
        }, { passive: false });

        // Tooltip Functions
        const tooltip = document.getElementById('tooltip');
        function showTooltip(landmark, clientX, clientY) {
            const config = categoryConfig[landmark.category];
            document.getElementById('tooltipBadge').className = `w-2.5 h-2.5 rounded-full ${config.badgeBg}`;
            document.getElementById('tooltipCategory').textContent = config.name;
            document.getElementById('tooltipTitle').textContent = landmark.name;
            document.getElementById('tooltipId').textContent = landmark.id;
            document.getElementById('tooltipX').textContent = landmark.x.toFixed(1);
            document.getElementById('tooltipY').textContent = landmark.y.toFixed(1);

            tooltip.classList.remove('hidden');
            updateTooltipPosition(clientX, clientY);
        }

        function updateTooltipPosition(clientX, clientY) {
            tooltip.style.left = `${clientX + 15}px`;
            tooltip.style.top = `${clientY + 15}px`;
        }

        function hideTooltip() {
            tooltip.classList.add('hidden');
        }

        // Control Buttons & Filters
        document.getElementById('zoomInBtn').addEventListener('click', () => {
            const container = canvas.parentElement;
            const cx = container.clientWidth / 2;
            const cy = container.clientHeight / 2;
            const newScale = Math.min(10, scale * 1.25);
            offsetX = cx - (cx - offsetX) * (newScale / scale);
            offsetY = cy - (cy - offsetY) * (newScale / scale);
            scale = newScale;
            drawGraph();
        });

        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            const container = canvas.parentElement;
            const cx = container.clientWidth / 2;
            const cy = container.clientHeight / 2;
            const newScale = Math.max(0.5, scale / 1.25);
            offsetX = cx - (cx - offsetX) * (newScale / scale);
            offsetY = cy - (cy - offsetY) * (newScale / scale);
            scale = newScale;
            drawGraph();
        });

        document.getElementById('resetViewBtn').addEventListener('click', () => {
            scale = 1;
            offsetX = 0;
            offsetY = 0;
            drawGraph();
        });

        const toggleEdgesBtn = document.getElementById('toggleEdgesBtn');
        toggleEdgesBtn.addEventListener('click', () => {
            showEdges = !showEdges;
            toggleEdgesBtn.innerHTML = `<i class="fa-solid fa-network-wired"></i><span class="hidden md:inline">Edges: ${showEdges ? 'On' : 'Off'}</span>`;
            if (showEdges) {
                toggleEdgesBtn.className = "bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg flex items-center space-x-1.5 transition shadow-md shadow-indigo-600/20";
            } else {
                toggleEdgesBtn.className = "bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-3 py-2 rounded-lg flex items-center space-x-1.5 transition shadow-sm";
            }
            drawGraph();
        });

        // Map Image Background Toggle & Opacity Slider
        const toggleMapBgBtn = document.getElementById('toggleMapBgBtn');
        toggleMapBgBtn.addEventListener('click', () => {
            showMapBg = !showMapBg;
            toggleMapBgBtn.innerHTML = `<i class="fa-solid fa-image"></i><span class="hidden md:inline">Map Image: ${showMapBg ? 'On' : 'Off'}</span>`;
            if (showMapBg) {
                toggleMapBgBtn.className = "bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg flex items-center space-x-1.5 transition shadow-md shadow-indigo-600/20";
            } else {
                toggleMapBgBtn.className = "bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-3 py-2 rounded-lg flex items-center space-x-1.5 transition shadow-sm";
            }
            drawGraph();
        });

        const mapOpacitySlider = document.getElementById('mapOpacitySlider');
        mapOpacitySlider.addEventListener('input', (e) => {
            mapOpacity = parseInt(e.target.value, 10) / 100;
            document.getElementById('opacityVal').textContent = `${e.target.value}%`;
            drawGraph();
        });

        // Search Input
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            drawGraph();
        });

        // Category Checkbox Filters
        document.querySelectorAll('#categoryFilters input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const cat = e.target.dataset.category;
                activeCategories[cat] = e.target.checked;
                drawGraph();
            });
        });

        // Initial Load Draw
        window.onload = function() {
            // Update counts in UI
            for (const [cat, count] of Object.entries({
                forest: 6,
                mountain: 14,
                lake: 9,
                open_land: 12,
                town: 16
            })) {
                const el = document.getElementById(`count-${cat}`);
                if (el) el.textContent = count;
            }
            resizeCanvas();
        };
    </script>
</body>
</html>
